<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volver — Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="volver-style.css">
<style>
  body{ display:flex; justify-content:center; align-items:center; min-height:100vh; }
  .login-wrap{ max-width:400px; width:100%; padding:32px 24px; }
  .login-wrap .brand-bar{ justify-content:center; margin-bottom:28px; }
  .login-wrap .brand-mark{ margin-left:0; }
  .login-wrap h1{ text-align:center; font-size:26px; }
  .login-wrap .sub{ text-align:center; margin-bottom:28px; }

  .login-field{ margin-bottom:14px; }
  .login-field label{ display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:6px; }
  .login-field input{
    width:100%; box-sizing:border-box; padding:12px 14px; border-radius:10px;
    border:1px solid var(--panel-line); background:var(--bg); color:var(--text);
    font-family:'IBM Plex Sans', sans-serif; font-size:14px;
  }
  .login-field input:focus{ outline:none; border-color:var(--gold); }

  .login-primary-btn{
    width:100%; padding:13px; border-radius:10px; border:none; margin-top:6px;
    background:var(--gold); color:#12162A; font-family:'IBM Plex Sans', sans-serif;
    font-size:14px; font-weight:600; cursor:pointer; transition:opacity .2s ease;
  }
  .login-primary-btn:hover{ opacity:.9; }
  .login-primary-btn:disabled{ opacity:.5; cursor:not-allowed; }

  .login-divider{
    display:flex; align-items:center; gap:12px; margin:20px 0;
    font-size:12px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em;
  }
  .login-divider::before, .login-divider::after{ content:''; flex:1; height:1px; background:var(--panel-line); }

  .login-google-btn{
    width:100%; padding:12px; border-radius:10px; border:1px solid var(--panel-line);
    background:var(--panel); color:var(--text); font-family:'IBM Plex Sans', sans-serif;
    font-size:14px; font-weight:600; cursor:pointer; display:flex; align-items:center;
    justify-content:center; gap:10px; transition:border-color .2s ease;
  }
  .login-google-btn:hover{ border-color:var(--gold); }
  .login-google-btn svg{ width:18px; height:18px; flex-shrink:0; }

  .login-links{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:10px; flex-wrap:wrap; }
  .login-links button{
    background:none; border:none; padding:0; font-family:'IBM Plex Sans', sans-serif;
    font-size:12.5px; color:var(--text-dim); cursor:pointer; text-decoration:underline;
  }
  .login-links button:hover{ color:var(--gold); }

  .login-error{
    font-size:12.5px; line-height:1.5; color:var(--worry); margin:0 0 14px;
    background:rgba(168,92,107,0.08); border:1px solid rgba(168,92,107,0.3);
    border-radius:10px; padding:10px 14px;
  }
  .login-notice{
    font-size:12.5px; line-height:1.5; color:var(--calm); margin:0 0 14px;
    background:rgba(120,160,120,0.08); border:1px solid rgba(120,160,120,0.3);
    border-radius:10px; padding:10px 14px;
  }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<script>
(function(){
  if(sessionStorage.getItem('volver_boot_splash_shown')) return;
  sessionStorage.setItem('volver_boot_splash_shown', '1');
  document.write(
    '<div class="intro-splash" id="volverIntroSplash">' +
      '<div class="intro-boat-wrap">' +
        '<svg class="intro-ripples" viewBox="0 0 140 40" fill="none">' +
          '<ellipse class="ring r1" cx="70" cy="24" rx="26" ry="6"/>' +
          '<ellipse class="ring r2" cx="70" cy="24" rx="26" ry="6"/>' +
          '<ellipse class="ring r3" cx="70" cy="24" rx="26" ry="6"/>' +
        '</svg>' +
        '<svg class="intro-boat" viewBox="0 0 52 52" fill="none">' +
          '<path d="M9 25 L20 35 L32 35 L43 25" stroke="#2C3459" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>' +
          '<path d="M9 25 L26 8 L43 25 Z" fill="#D9A441"/>' +
          '<path d="M26 8 L26 25" stroke="#2C3459" stroke-width="1.6" stroke-linecap="round"/>' +
        '</svg>' +
      '</div>' +
      '<div class="intro-word">Volver</div>' +
    '</div>'
  );
})();
</script>
<div class="stage-wrap login-wrap">

  <div class="brand-bar">
    <svg class="brand-mark" viewBox="0 0 52 52" fill="none">
      <path d="M9 25 L20 35 L32 35 L43 25" stroke="#2C3459" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M9 25 L26 8 L43 25 Z" fill="#D9A441"/>
      <path d="M26 8 L26 25" stroke="#2C3459" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <span class="brand-word">Volver</span>
  </div>

  <h1 id="loginTitle" data-i18n="login_title">Entrar na Volver</h1>
  <p class="sub" id="loginSubtitle" data-i18n="login_subtitle">Faça login para continuar sua jornada de reflexões.</p>

  <div id="loginError" class="login-error" hidden></div>
  <div id="loginNotice" class="login-notice" hidden></div>

  <form id="loginForm">
    <div class="login-field" id="loginNameField" hidden>
      <label for="loginName" data-i18n="login_name">Nome</label>
      <input type="text" id="loginName" autocomplete="name">
    </div>
    <div class="login-field">
      <label for="loginEmail" data-i18n="login_email">E-mail</label>
      <input type="email" id="loginEmail" autocomplete="email" required>
    </div>
    <div class="login-field">
      <label for="loginPassword" data-i18n="login_password">Senha</label>
      <input type="password" id="loginPassword" autocomplete="current-password" required minlength="6">
    </div>
    <button type="submit" id="loginSubmitBtn" class="login-primary-btn" data-i18n="login_signin_btn">Entrar</button>
  </form>

  <div class="login-links">
    <button type="button" id="loginForgotBtn" data-i18n="login_forgot">Esqueci minha senha</button>
    <button type="button" id="loginToggleBtn" data-i18n="login_toggle_to_signup">Ainda não tem conta? Criar conta</button>
  </div>

  <div class="login-divider" id="loginOr" data-i18n="login_or">ou</div>

  <button type="button" id="loginGoogleBtn" class="login-google-btn">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
    <span id="loginGoogleLabel" data-i18n="login_google_btn">Continuar com Google</span>
  </button>

  <footer>Volver · entrar · reflexão interativa</footer>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function(){
    if(!window.Volver) return;
    var V = window.Volver;
    var mode = 'signin'; // 'signin' | 'signup'

    var form = document.getElementById('loginForm');
    var emailInput = document.getElementById('loginEmail');
    var passwordInput = document.getElementById('loginPassword');
    var submitBtn = document.getElementById('loginSubmitBtn');
    var toggleBtn = document.getElementById('loginToggleBtn');
    var forgotBtn = document.getElementById('loginForgotBtn');
    var googleBtn = document.getElementById('loginGoogleBtn');
    var errorBox = document.getElementById('loginError');
    var noticeBox = document.getElementById('loginNotice');

    function showError(msg){ noticeBox.hidden = true; errorBox.textContent = msg; errorBox.hidden = false; }
    function showNotice(msg){ errorBox.hidden = true; noticeBox.textContent = msg; noticeBox.hidden = false; }
    function clearMessages(){ errorBox.hidden = true; noticeBox.hidden = true; }

    var nameField = document.getElementById('loginNameField');
    var nameInput = document.getElementById('loginName');

    function syncMode(){
      submitBtn.textContent = mode === 'signin' ? V.t('login_signin_btn') : V.t('login_signup_btn');
      toggleBtn.textContent = mode === 'signin' ? V.t('login_toggle_to_signup') : V.t('login_toggle_to_signin');
      nameField.hidden = mode !== 'signup';
      nameInput.required = mode === 'signup';
      clearMessages();
    }
    syncMode();

    toggleBtn.addEventListener('click', function(){
      mode = mode === 'signin' ? 'signup' : 'signin';
      syncMode();
    });

    form.addEventListener('submit', function(e){
      e.preventDefault();
      clearMessages();
      submitBtn.disabled = true;
      var email = emailInput.value.trim();
      var password = passwordInput.value;
      var action = mode === 'signin' ? V.auth.signInWithEmail(email, password) : V.auth.signUpWithEmail(email, password, nameInput.value.trim());
      action.catch(function(err){
        showError(V.auth.errorMessage(err));
      }).finally(function(){
        submitBtn.disabled = false;
      });
    });

    forgotBtn.addEventListener('click', function(){
      clearMessages();
      var email = emailInput.value.trim();
      if(!email){ showError(V.t('err_invalid_email')); return; }
      V.auth.sendPasswordReset(email).then(function(){
        showNotice(V.t('login_forgot_sent'));
      }).catch(function(err){
        showError(V.auth.errorMessage(err));
      });
    });

    googleBtn.addEventListener('click', function(){
      clearMessages();
      googleBtn.disabled = true;
      V.auth.signInWithGoogle().catch(function(err){
        showError(V.auth.errorMessage(err));
      }).finally(function(){
        googleBtn.disabled = false;
      });
    });

    document.addEventListener('volver:lang', syncMode);
  });
</script>
<script defer src="volver-app.js"></script>
</body>
</html>
