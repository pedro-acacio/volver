<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volver — Perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="volver-style.css">
<style>
  body{ display:flex; justify-content:center; }

  .streak-banner{
    display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
    background: var(--panel); border:1px solid var(--panel-line); border-radius:14px;
    padding:20px 22px; margin-top:28px;
  }
  .streak-main{ display:flex; align-items:center; gap:14px; }
  .streak-flame{ width:32px; height:32px; flex-shrink:0; }
  .streak-flame path{ stroke: var(--gold); }
  .streak-main b{ display:block; font-family:'Fraunces', serif; font-weight:600; font-size:26px; color: var(--gold); line-height:1.15; }
  .streak-main span{ font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--text-faint); text-transform:uppercase; letter-spacing:.05em; }
  .streak-longest{ font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--text-faint); text-align:right; text-transform:uppercase; letter-spacing:.05em; }
  .streak-longest b{ display:block; color: var(--text); font-family:'Fraunces', serif; font-weight:600; font-size:16px; text-transform:none; letter-spacing:normal; }
  .streak-history-label{
    width:100%; font-family:'IBM Plex Mono', monospace; font-size:10.5px; color: var(--text-faint);
    text-transform:uppercase; letter-spacing:.05em; margin-top:16px; padding-top:16px; border-top:1px solid var(--panel-line);
  }
  .streak-history{ display:flex; gap:6px; width:100%; margin-top:10px; }
  .streak-day{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .streak-day-dot{ width:22px; height:22px; border-radius:50%; border:1.5px solid var(--panel-line); background: var(--bg); transition: background .2s ease, border-color .2s ease; }
  .streak-day-dot.done{ background: var(--gold); border-color: var(--gold); }
  .streak-day.today .streak-day-dot{ outline:2px solid var(--gold); outline-offset:2px; }
  .streak-day-label{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; color: var(--text-faint); }
  .streak-empty{ font-size:12.5px; color: var(--text-faint); font-family:'IBM Plex Mono', monospace; }
  @media (max-width:480px){ .streak-banner{ padding:18px; } .streak-longest{ text-align:left; } }

  .profile-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:14px; margin: 28px 0 8px; }
  @media (max-width:600px){ .profile-grid{ grid-template-columns:1fr; } }
  .profile-stat{ background: var(--panel); border:1px solid var(--panel-line); border-radius:14px; padding:20px 22px; text-align:center; }
  .profile-stat b{ display:block; font-family:'Fraunces', serif; font-weight:600; font-size:30px; color: var(--gold); margin-bottom:6px; }
  .profile-stat span{ font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--text-faint); text-transform:uppercase; letter-spacing:.06em; }

  .profile-section{ margin-top:40px; }
  .profile-section h2{ font-family:'Fraunces', serif; font-weight:500; font-size:17px; margin:0 0 14px; }
  .profile-list{ display:flex; flex-direction:column; gap:8px; }
  .profile-item{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background: var(--panel); border:1px solid var(--panel-line); border-radius:11px; padding:12px 16px;
    text-decoration:none; transition: border-color .2s ease;
  }
  .profile-item:hover{ border-color: var(--gold); }
  .profile-item .t{ font-size:13.5px; color: var(--text); }
  .profile-item .r{ font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--text-faint); white-space:nowrap; }
  .profile-empty{ font-size:13px; color: var(--text-faint); font-family:'IBM Plex Mono', monospace; }

  .account-card{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    background: var(--panel); border:1px solid var(--panel-line); border-radius:14px;
    padding:18px 20px; margin-top:24px;
  }
  .account-info{ display:flex; align-items:center; gap:14px; min-width:0; }
  .account-avatar{ width:44px; height:44px; border-radius:50%; flex-shrink:0; object-fit:cover; }
  .account-avatar-fallback{
    display:flex; align-items:center; justify-content:center; background: var(--gold); color:#12162A;
    font-family:'Fraunces', serif; font-weight:600; font-size:18px;
  }
  .account-name{ font-size:14.5px; color: var(--text); font-weight:600; }
  .account-email{ font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--text-faint); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .settings-btn{
    flex-shrink:0; padding:10px 18px; border-radius:9px; border:1px solid var(--panel-line);
    background: var(--bg); color: var(--text); font-family:'IBM Plex Sans', sans-serif;
    font-size:13px; font-weight:600; cursor:pointer; transition: all .2s ease; white-space:nowrap;
  }
  .settings-btn:hover{ border-color: var(--gold); }
  .settings-btn.danger{ color: var(--worry); border-color: rgba(168,92,107,0.4); }
  .settings-btn.danger:hover{ border-color: var(--worry); }
  .account-danger-panel{ width:100%; margin-top:16px; padding-top:16px; border-top:1px solid var(--panel-line); }
  .account-danger-desc{ font-size:12.5px; line-height:1.5; color: var(--worry); margin:0 0 14px; }
  .account-reauth{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .account-reauth input{
    flex:1; min-width:160px; padding:10px 12px; border-radius:9px; border:1px solid var(--panel-line);
    background: var(--bg); color: var(--text); font-family:'IBM Plex Sans', sans-serif; font-size:13.5px;
  }
  .account-reauth input:focus{ outline:none; border-color: var(--gold); }
</style>
</head>
<body>
<div class="stage-wrap" style="max-width:760px;">

  <div class="brand-bar">
    <svg class="brand-mark" viewBox="0 0 52 52" fill="none">
      <path d="M9 25 L20 35 L32 35 L43 25" stroke="#2C3459" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M9 25 L26 8 L43 25 Z" fill="#D9A441"/>
      <path d="M26 8 L26 25" stroke="#2C3459" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <a class="brand-word" href="index.html">Volver</a>
  </div>

  <div class="eyebrow" data-i18n="profile_eyebrow">Sua jornada</div>
  <h1 data-i18n="profile_title">Perfil</h1>
  <p class="sub" data-i18n="profile_sub">Um resumo do que você já concluiu, do que está em andamento e do que favoritou — tudo salvo neste navegador.</p>

  <div class="account-card" id="accountCard" hidden></div>

  <div class="streak-banner" id="streakBanner"></div>

  <div class="profile-grid" id="profileGrid"></div>

  <div class="profile-section">
    <h2 data-i18n="stat_completed">Concluídas</h2>
    <div class="profile-list" id="listCompleted"></div>
  </div>

  <div class="profile-section">
    <h2 data-i18n="stat_progress">Em andamento</h2>
    <div class="profile-list" id="listProgress"></div>
  </div>

  <div class="profile-section">
    <h2 data-i18n="stat_favorites">Favoritas</h2>
    <div class="profile-list" id="listFavorites"></div>
  </div>

  <footer data-i18n="footer_profile">Volver · perfil local · reflexão interativa</footer>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function(){
    function armConfirm(btn, onConfirm, resyncLabel){
      if(btn.dataset.confirming === '1'){
        clearTimeout(btn._volverTimer);
        delete btn.dataset.confirming;
        onConfirm();
        return;
      }
      btn.dataset.confirming = '1';
      var original = btn.textContent;
      btn.textContent = window.Volver.t('cfg_clear_confirm');
      btn._volverTimer = setTimeout(function(){
        delete btn.dataset.confirming;
        btn.textContent = original;
      }, 4000);
    }

    function renderAccount(){
      var V = window.Volver;
      var info = V.getCurrentUserInfo();
      var card = document.getElementById('accountCard');
      if(!info){ card.hidden = true; return; }
      card.hidden = false;

      var avatarHtml = info.photoURL
        ? '<img src="' + info.photoURL + '" alt="" class="account-avatar">'
        : '<div class="account-avatar account-avatar-fallback">' + (info.displayName || info.email || '?').charAt(0).toUpperCase() + '</div>';
      var providerLabel = info.providerId === 'google.com' ? V.t('account_provider_google') : V.t('account_provider_password');

      card.innerHTML =
        '<div class="account-info">' + avatarHtml +
          '<div><div class="account-name">' + (info.displayName || info.email) + '</div>' +
          '<div class="account-email">' + info.email + ' · ' + providerLabel + '</div></div>' +
        '</div>' +
        '<button type="button" id="accountDeleteBtn" class="settings-btn danger">' + V.t('profile_account_delete') + '</button>' +
        '<div class="account-danger-panel" id="accountDangerPanel" hidden>' +
          '<p class="account-danger-desc" id="accountDangerDesc">' + V.t('profile_account_delete_desc') + '</p>' +
          '<div class="account-reauth" id="accountReauthRow" hidden>' +
            '<input type="password" id="accountReauthPassword" autocomplete="current-password" placeholder="' + V.t('profile_account_reauth_password_label') + '">' +
            '<button type="button" id="accountReauthBtn" class="settings-btn danger">' + V.t('profile_account_reauth_password_btn') + '</button>' +
          '</div>' +
        '</div>';

      var deleteBtn = document.getElementById('accountDeleteBtn');
      var dangerPanel = document.getElementById('accountDangerPanel');
      var dangerDesc = document.getElementById('accountDangerDesc');
      var reauthRow = document.getElementById('accountReauthRow');
      var reauthPassword = document.getElementById('accountReauthPassword');
      var reauthBtn = document.getElementById('accountReauthBtn');

      function showError(msg){
        dangerDesc.textContent = msg;
        dangerDesc.style.color = 'var(--worry)';
      }

      function runDelete(){
        deleteBtn.disabled = true;
        V.auth.deleteAccount().then(function(){
          location.href = 'login.html';
        }).catch(function(err){
          deleteBtn.disabled = false;
          if(err && err.code === 'auth/requires-recent-login'){
            dangerPanel.hidden = false;
            if(info.providerId === 'google.com'){
              V.auth.reauthenticateWithGoogle().then(runDelete).catch(function(){
                showError(V.t('profile_account_delete_error'));
              });
            } else {
              reauthRow.hidden = false;
              showError(V.t('profile_account_reauth_needed'));
            }
          } else {
            showError(V.t('profile_account_delete_error'));
          }
        });
      }

      deleteBtn.addEventListener('click', function(){
        if(dangerPanel.hidden){ dangerPanel.hidden = false; return; }
        armConfirm(deleteBtn, runDelete);
      });

      reauthBtn.addEventListener('click', function(){
        var pw = reauthPassword.value;
        if(!pw) return;
        reauthBtn.disabled = true;
        V.auth.reauthenticateWithPassword(pw).then(runDelete).catch(function(){
          reauthBtn.disabled = false;
          showError(V.t('profile_account_delete_error'));
        });
      });
    }

    function renderStreak(){
      var V = window.Volver;
      var info = V.getStreakInfo();
      var history = V.getStreakHistory(7);
      var banner = document.getElementById('streakBanner');
      if(info.current === 0 && info.longest === 0){
        banner.innerHTML = '<div class="streak-empty">' + V.t('profile_streak_empty') + '</div>';
        return;
      }
      banner.innerHTML =
        '<div class="streak-main">' +
          '<svg class="streak-flame" viewBox="0 0 16 16" fill="none"><path d="M8 1.3C8 1.3 4.6 5.2 4.6 8.6C4.6 11.1 6.1 12.7 8 12.7C9.9 12.7 11.4 11.1 11.4 8.6C11.4 7.3 10.8 6.3 10.2 5.6C10.3 6.6 9.7 7.3 9 7.4C9.5 5.7 8.7 3.7 8 1.3Z" stroke-width="1.2" stroke-linejoin="round"/></svg>' +
          '<div><b>' + info.current + '</b><span>' + V.t('profile_streak_current') + '</span></div>' +
        '</div>' +
        '<div class="streak-longest"><b>' + info.longest + '</b>' + V.t('profile_streak_longest') + '</div>' +
        '<div class="streak-history-label">' + V.t('profile_streak_history') + '</div>' +
        '<div class="streak-history">' +
          history.map(function(d){
            var day = parseInt(d.key.split('-')[2], 10);
            return '<div class="streak-day' + (d.isToday ? ' today' : '') + '">' +
              '<div class="streak-day-dot' + (d.done ? ' done' : '') + '"></div>' +
              '<span class="streak-day-label">' + day + '</span>' +
            '</div>';
          }).join('') +
        '</div>';
    }

    function render(){
      if(!window.Volver) return;
      var V = window.Volver;
      var s = V.getSummary();
      renderAccount();
      renderStreak();
      document.getElementById('profileGrid').innerHTML =
        '<div class="profile-stat"><b>' + s.completed.length + '</b><span>' + V.t('stat_completed') + '</span></div>' +
        '<div class="profile-stat"><b>' + s.inProgress.length + '</b><span>' + V.t('stat_progress') + '</span></div>' +
        '<div class="profile-stat"><b>' + s.favorites.length + '</b><span>' + V.t('stat_favorites') + '</span></div>';

      function renderList(elId, items, emptyKey){
        var el = document.getElementById(elId);
        if(items.length === 0){ el.innerHTML = '<div class="profile-empty">' + V.t(emptyKey) + '</div>'; return; }
        el.innerHTML = items.map(function(it){
          return '<a class="profile-item" href="' + it.href + '"><span class="t">' + it.title + '</span><span class="r">' + (it.ref || '') + '</span></a>';
        }).join('');
      }
      renderList('listCompleted', s.completed, 'list_completed_empty');
      renderList('listProgress', s.inProgress, 'list_progress_empty');
      renderList('listFavorites', s.favorites, 'list_favorites_empty');
    }
    if(window.Volver){ render(); } else { window.addEventListener('load', render); }
    document.addEventListener('volver:lang', render);
  });
</script>
<script defer src="volver-app.js"></script>
</body>
</html>
